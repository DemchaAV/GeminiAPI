name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-verify:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify release build
        run: ./mvnw -B -ntp clean verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            target/*.jar
            target/*.pom

  publish:
    name: Publish to Maven Central
    needs: build-verify
    runs-on: ubuntu-latest
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Publish signed artifacts
        run: ./mvnw -B -ntp -Prelease clean deploy

      - name: Upload published bundles
        uses: actions/upload-artifact@v4
        with:
          name: central-bundles
          path: |
            target/*.jar
            target/*.pom
            target/central-publishing/**

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.jar
            dist/**/*.pom
            dist/**/*.zip
